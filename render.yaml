services:
  - type: web
    runtime: static
    name: stackhr-admin
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /v1/api/*
        destination: /v1/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html